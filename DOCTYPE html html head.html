<!DOCTYPE html>
<html>
<head>
    <title>Canvas Tommy Fixed</title>
    <style>
        body { background: #222; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        canvas { background: #333; border: 2px solid #555; }
    </style>
</head>
<body>

<canvas id="game" width="200" height="200"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

function drawTommy(ctx, x, y, isTalking) {
    ctx.save();
    ctx.translate(x, y);
    ctx.lineWidth = 1.6;
    ctx.strokeStyle = '#000';
    ctx.fillStyle = '#000';

    // 1. Справжня довга дика борода та волосся Томі
    ctx.beginPath();
    ctx.moveTo(35, 23);
    ctx.quadraticCurveTo(20, 25, 25, 45);
    ctx.quadraticCurveTo(25, 60, 38, 70);
    ctx.lineTo(50, 85); 
    ctx.lineTo(62, 70);
    ctx.quadraticCurveTo(75, 60, 75, 45);
    ctx.quadraticCurveTo(80, 25, 65, 23);
    ctx.quadraticCurveTo(50, 15, 35, 23);
    ctx.stroke();

    // 2. Внутрішній контур обличчя
    ctx.beginPath();
    ctx.moveTo(37, 23);
    ctx.lineTo(37, 48);
    ctx.quadraticCurveTo(37, 54, 50, 54);
    ctx.quadraticCurveTo(63, 54, 63, 48);
    ctx.lineTo(63, 23);
    ctx.stroke();

    // 3. Корона опущена прямо на зачіску (Y зміщено на 24)
    ctx.beginPath();
    ctx.moveTo(35, 24); 
    ctx.lineTo(31, 14); 
    ctx.lineTo(39, 18); 
    ctx.lineTo(43, 11); 
    ctx.lineTo(47, 18); 
    ctx.lineTo(54, 14); 
    ctx.lineTo(50, 25); 
    ctx.stroke();

    // 4. Великі круглі очі
    ctx.beginPath(); ctx.arc(44, 33, 5.5, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(56, 33, 5.5, 0, Math.PI * 2); ctx.stroke();

    // 5. Шалені зіниці-крапки
    ctx.beginPath(); ctx.arc(44, 33, 0.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(56, 33, 0.8, 0, Math.PI * 2); ctx.fill();

    // 6. Мішки втоми під очима
    ctx.beginPath(); ctx.moveTo(39, 41); ctx.quadraticCurveTo(44, 43, 49, 41); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(51, 41); ctx.quadraticCurveTo(56, 43, 61, 41); ctx.stroke();

    // 7. Довгий ніс
    ctx.beginPath();
    ctx.moveTo(49, 36);
    ctx.lineTo(49, 45);
    ctx.quadraticCurveTo(51, 47, 52, 45);
    ctx.stroke();

    // 8. Анімований рот (опущений нижче на Y: 57 - тепер він у бороді)
    ctx.beginPath();
    ctx.moveTo(44, 57);
    let mouthY = isTalking ? 57 + Math.sin(Date.now() * 0.02) * 2.5 : 58;
    ctx.quadraticCurveTo(50, mouthY, 56, 57);
    ctx.lineWidth = isTalking ? 1.6 + Math.abs(Math.sin(Date.now() * 0.02)) * 1 : 1.6;
    ctx.stroke();

    ctx.restore();
}

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawTommy(ctx, 50, 50, true);
    requestAnimationFrame(loop);
}

loop();
</script>

</body>
</html>
